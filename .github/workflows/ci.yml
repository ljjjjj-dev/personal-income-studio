name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check Node.js & ES module syntax
        run: |
          node --check server.mjs
          for f in public/app/*.js; do
            node --check "$f"
          done

      - name: Run unit tests
        run: npm test
